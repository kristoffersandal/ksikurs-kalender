name: Oppdater kurskalender
on:
  push:
    branches: [main]
    paths:
      - 'skanner.py'
      - '.github/workflows/oppdater-kurs.yml'
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'skanner.py'
      - '.github/workflows/oppdater-kurs.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ksikurs-kurskalender
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python skanner.py --fixture
      - run: python skanner.py
      - name: Commit course data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/kurs.json
          if ! git diff --cached --quiet; then
            git commit -m "Oppdater kommende kurs"
            git push
          fi
  publish:
    if: ${{ always() }}
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deploy
